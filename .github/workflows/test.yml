name: Run tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# needed to allow julia-actions/cache to delete old caches that it has created
permissions:
  actions: write
  contents: read

jobs:
  test:
    # runs-on: ${{ matrix.os }}
    # strategy:
    #   matrix:
    #     julia-version: ['1.12', 'pre']
    #     julia-arch: [x64, x86]
    #     os: [ubuntu-latest, windows-latest, macOS-latest]
    #     exclude:
    #       - os: macOS-latest
    #         julia-arch: x86
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ["1.10", "1", "pre"]
        
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - uses: julia-actions/cache@v2

      - name: setup for GLMakie
        run: |
          sudo apt-get update
          sudo apt-get install -y xorg-dev mesa-utils xvfb \
            libgl1 freeglut3-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxext-dev xsettingsd \
            x11-xserver-utils

      - name: Run the tests
        continue-on-error: true
        run: >
          DISPLAY=:0 xvfb-run -s '-screen 0 1024x768x24' julia --project=. -e 'using Pkg; Pkg.test("OpenSOAP", coverage=true)'
            
      # - uses: GabrielBB/xvfb-action@v1
      #   with:
      #     run: julia --project=. -e "using Pkg; Pkg.build(); Pkg.precompile()"

